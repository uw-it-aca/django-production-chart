{{- if .Values.gateway.enabled }}
{{- $_ := set .Values "releaseIdentifier" ( include "django-production-chart.releaseIdentifier" . ) }}
{{- $_ := set .Values "namespaceIdentifier" ( include "django-production-chart.namespaceIdentifier" . ) }}
{{- $_ := set .Values "instanceIdentifier" ( include "django-production-chart.instanceIdentifier" . ) }}
{{- $fullName := include "django-production-chart.fullname" . -}}
{{- $branch := .Values.branch}}
apiVersion: gateway.networking.k8s.io/v1
kind: ListenerSet
metadata:
  name: {{ $.Values.releaseIdentifier }}
  namespace: {{ $.Values.namespaceIdentifier }}
  labels:
    app.kubernetes.io/name: {{ $.Values.releaseIdentifier }}
    app.kubernetes.io/instance: {{ $.Values.instanceIdentifier }}
    app.kubernetes.io/component: gateway
{{- include "django-production-chart.resourceLabels" $ | nindent 4 }}
  annotations:
    cert-manager.io/cluster-issuer: {{ (.Values.gateway).clusterIssuer | default "letsencrypt-gw" }}
{{- with .Values.gateway.annotations }}
{{ toYaml . | indent 4 }}
{{- end }}
{{- if .Values.securityPolicy.enabled }}
{{- include "django-production-chart.securityPolicyAnnotations" .Values.securityPolicy.ingress | indent 4 }}
{{- end }}
spec:
  parentRef:
    name: default-gateway
    namespace: kgateway-system
  listeners:
{{- range $index, $hostname :=  .Values.gateway.hostnames }}
    - name: http-{{ $index }}
      protocol: HTTP
      port: 80
      hostname: {{ $hostname }}
    - name: https-{{ $index }}
      protocol: HTTPS
      port: 443
      hostname: {{ $hostname }}
      tls:
        mode: Terminate
        certificateRefs:
          - name: {{ $hostname }}-tls
{{- if $.Values.gateway.tlsCipherSuites }}
        options:
          kgateway.dev/cipher-suites: {{ ( join ","  $.Values.gateway.tlsCipherSuites ) | quote }}
{{- end }}
{{- end }}
{{- range $index, $hostname := .Values.gateway.hostnames }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $.Values.releaseIdentifier }}-http-{{ $index }}
  namespace: {{ $.Values.namespaceIdentifier }}
  labels:
    app.kubernetes.io/name: {{ $.Values.releaseIdentifier }}
    app.kubernetes.io/instance: {{ $.Values.instanceIdentifier }}
    app.kubernetes.io/component: gateway
{{- include "django-production-chart.resourceLabels" $ | nindent 4 }}
spec:
  parentRefs:
    - kind: ListenerSet
      group: gateway.networking.k8s.io
      name: {{ $.Values.releaseIdentifier }}
      namespace: {{ $.Values.namespaceIdentifier }}
      sectionName: "http-{{ $index }}"
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $.Values.releaseIdentifier }}-https-{{ $index }}
  namespace: {{ $.Values.namespaceIdentifier }}
  labels:
    app.kubernetes.io/name: {{ $.Values.releaseIdentifier }}
    app.kubernetes.io/instance: {{ $.Values.instanceIdentifier }}
    app.kubernetes.io/component: gateway
{{- include "django-production-chart.resourceLabels" $ | nindent 4 }}
spec:
  parentRefs:
    - kind: ListenerSet
      group: gateway.networking.k8s.io
      name: {{ $fullName }}
      namespace: {{ $.Values.namespaceIdentifier }}
      sectionName: https-{{ $index }}
  rules:
    - backendRefs:
      - name: {{ $.Values.releaseIdentifier }}
        namespace: {{ $.Values.namespaceIdentifier }}
        kind: Service
        port: 80
        weight: 1
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            set:
              - name: X-Forwarded-Proto
                value: https
              - name: X-Forwarded-Scheme
                value: https
      matches:
        - path:
            type: PathPrefix
            value: /
{{- end }}
{{- if $.Values.gateway.maxRequestSize }}
---
apiVersion: gateway.kgateway.dev/v1alpha1
kind: TrafficPolicy
metadata:
  name: {{ $.Values.releaseIdentifier }}
  namespace: {{ $.Values.namespaceIdentifier }}
  labels:
    app.kubernetes.io/name: {{ $.Values.releaseIdentifier }}
    app.kubernetes.io/instance: {{ $.Values.instanceIdentifier }}
    app.kubernetes.io/component: gateway
{{- include "django-production-chart.resourceLabels" $ | nindent 4 }}
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: {{ $.Values.releaseIdentifier }}
  buffer:
    maxRequestSize: {{ .Values.gateway.maxRequestSize }}
{{- end }}
{{- end }}
